<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#193427" />
    <title>Section Forge - Forge storefront-ready code</title>
  </head>
  <body>
    <div class="app-container">
      <!-- Top header bar -->
      <header class="header-banner">
        <div class="header-left">
          <div class="eyebrow-tag">BUILDER SECTION CONVERTER</div>
          <h1 class="main-title">Forge storefront-ready code.</h1>
        </div>
        <div class="header-right">
          <button class="primary-action-btn" id="convertBtn">CONVERT SECTION</button>
        </div>
      </header>

      <!-- Main 3-column workbench grid -->
      <main class="workbench-grid" aria-label="Section converter workbench">
        <!-- Column 1: Source JSON -->
        <section class="panel-column source-column">
          <div class="column-header">
            <span class="column-index">01 / SOURCE</span>
            <span class="status-indicator">BUILDER SECTION READY</span>
          </div>
          <div class="source-editor-wrapper">
            <textarea
              id="sourceEditor"
              class="code-textarea"
              spellcheck="false"
              aria-label="Builder section source JSON"
            >{
  "@type": "@builder.io/sdk:Element",
  "component": {
    "name": "Hero",
    "options": {
      "eyebrow": "Spring / Summer 2025",
      "title": "Designed for the long way around.",
      "ctaText": "Shop the collection",
      "image": "https://images.unsplash.com/photo-1529139574466-a303027c1d8b"
    }
  }
}</textarea>
          </div>
        </section>

        <!-- Column 2: Code output (Liquid / CSS) -->
        <section class="panel-column code-column">
          <div class="column-header code-header">
            <div class="tab-group" role="tablist">
              <button class="tab-btn active" data-tab="liquid" role="tab" aria-selected="true">LIQUID</button>
              <button class="tab-btn" data-tab="css" role="tab" aria-selected="false">CSS</button>
            </div>
            <button class="copy-action-btn" id="copyCodeBtn">COPY CODE</button>
          </div>
          <div class="code-viewport">
            <pre class="code-content"><code id="codeDisplay"></code></pre>
          </div>
        </section>

        <!-- Column 3: Render / Theme Preview -->
        <section class="panel-column preview-column">
          <div class="column-header">
            <span class="column-index">03 / RENDER</span>
            <span class="status-indicator">THEME PREVIEW</span>
          </div>
          <div class="preview-viewport">
            <div class="rendered-storefront-card">
              <div class="card-image-layer">
                <img
                  src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=1000&q=80"
                  alt="Model wearing sunglasses with colorful flowers"
                  class="card-bg-image"
                />
                <div class="card-overlay">
                  <span class="card-eyebrow">SPRING / SUMMER 2025</span>
                  <h2 class="card-heading">Designed for the long way around.</h2>
                </div>
              </div>
              <div class="card-orange-accent"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div class="feedback-toast" id="toastMessage" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
